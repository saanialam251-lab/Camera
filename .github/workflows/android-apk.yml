name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Bootstrap Android if needed
        run: |
          if [ ! -f android/app/build.gradle ]; then
            flutter create . --project-name measure_reality --org com.measurereality --platforms=android
          fi
          mkdir -p android/app/src/main/kotlin/com/measurereality
          cp -f native/android/*.kt android/app/src/main/kotlin/com/measurereality/ || true
          # Ensure launcher icon exists (CI failure was missing mipmap/ic_launcher)
          if [ ! -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            echo "ERROR: ic_launcher.png missing"
            exit 1
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
